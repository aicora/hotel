services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hotel-app
    restart: unless-stopped

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hotelDB
      DB_USERNAME: hotel_user
      DB_PASSWORD: hotel_password

    depends_on:
      mysql:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    container_name: hotel-nginx
    restart: unless-stopped

    ports:
      - "4000:80"

    depends_on:
      - app

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro


  mysql:
    image: mysql:8.4

    container_name: hotel-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: hotelDB
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: hotel_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - hotel_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hotel_mysql_data: